name: Verify Build

on:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dev startup tests
        run: npm run test:dev-start
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Worker dependencies
        run: npm ci --prefix api
      - name: Worker TypeScript check
        run: npm run check --prefix api
      - name: Worker tests
        run: npm run test:ci --prefix api
